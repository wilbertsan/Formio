
version: 1
backend:
  phases:
    build:
      commands:
        - npm install --package-lock-only --ignore-scripts
        - npm ci --cache .npm --prefer-offline
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
